name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run mox compile
      - run: uv run pytest -q
      - name: slither (optional)
        continue-on-error: true
        run: uv run python scripts/slither_vyper.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      # Demo mode's committed ABIs (ADR-0016) must never drift from the compiled contracts.
      - run: node web/scripts/gen-demo-abis.mjs --check
        working-directory: ${{ github.workspace }}

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --directory api
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run build:demo
      - run: node web/scripts/check-demo-bundle.mjs
      - run: npx prettier --check web/src/demo e2e/demo web/src/features/marketing web/src/app/routes.tsx

  e2e:
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --directory api
      - run: npm ci
      - run: npx playwright install chromium --with-deps
        working-directory: e2e
      - run: npm run test:e2e
        env:
          CI: "true"
      # ADR-0016: builds dist-demo and serves it statically with no SPA fallback (demo/demo.config.ts).
      - run: npm run test:demo -w e2e
        env:
          CI: "true"
