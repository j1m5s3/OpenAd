# Local development infrastructure. See docs/ARCHITECTURE.md §7.
#
#   docker compose up -d          # start anvil + postgres
#   docker compose logs -f anvil  # watch blocks
#   docker compose down -v        # reset chain and database
#
# Anvil account #0 (deployer / test publisher):
#   address     0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
#   private key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
# Never use these keys anywhere but a local chain.

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    # The foundry image's entrypoint is `sh -c`, so the command is a single string.
    command: "anvil --host 0.0.0.0 --chain-id 31337 --block-time 2 --accounts 10 --balance 10000"
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast chain-id --rpc-url http://127.0.0.1:8545 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openad
      POSTGRES_PASSWORD: openad
      POSTGRES_DB: openad
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openad -d openad"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
