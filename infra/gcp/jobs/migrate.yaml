# Cloud Run Job `openad-migrate` (ADR-0017 "Migrations"): runs `alembic upgrade head` once,
# before traffic shifts to a new `openad-api` revision. Reuses the api image; never listens on
# a port (jobs don't need to). Applied with `gcloud run jobs replace`, run with
# `gcloud run jobs execute openad-migrate --wait` (scripts/deploy-gcp.sh does both).
#
# Required env vars at render time: PROJECT_ID, REGION, ENV, IMAGE_TAG, VPC_NETWORK, VPC_SUBNET
# (Direct VPC egress to Cloud SQL's private IP, docs/deploy-gcp.md §3).
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: openad-migrate
  labels:
    env: ${ENV}
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cloudsql-instances: ${PROJECT_ID}:${REGION}:openad-${ENV}
        # Direct VPC egress (docs/deploy-gcp.md §3, ADR-0017 amendment): see api.yaml's comment.
        # This job opens the FIRST connection to the private-IP instance (docs/deploy-gcp.md
        # §3's verify-first note); without this route it would fail closed before migrations
        # ever apply. (inferred; verify before deploy)
        run.googleapis.com/network-interfaces: '[{"network":"${VPC_NETWORK}","subnetwork":"${VPC_SUBNET}"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      template:
        spec:
          serviceAccountName: openad-migrate-${ENV}@${PROJECT_ID}.iam.gserviceaccount.com
          maxRetries: 1
          containers:
            - image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/openad/api:${IMAGE_TAG}
              command: ["uv", "run", "alembic", "upgrade", "head"]
              env:
                - name: OPENAD_ENV
                  value: "${ENV}"
                - name: OPENAD_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: openad-database-url-${ENV}
                      key: latest
                # No OPENAD_DB_POOL_SIZE/OPENAD_DB_MAX_OVERFLOW here: `alembic/env.py` builds
                # its own engine directly (`async_engine_from_config`), not
                # `openad.db.session.Database`, so those settings would be inert. The
                # connection budget (docs/deploy-gcp.md) counts this job as exactly 1
                # connection because that's what a single `alembic upgrade head` run opens.
