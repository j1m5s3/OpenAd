# Cloud Run service spec for `openad-web` (ADR-0017): the real (non-demo) static site,
# public, scale-to-zero-capable. Separate service from `openad-web-demo` so each can be
# promoted/rolled back independently.
#
# Required env vars at render time: PROJECT_ID, REGION, ENV, IMAGE_TAG, API_ORIGIN (e.g.
# https://api.staging.example.com), RPC_ORIGINS (space- or comma-free single CSP fragment,
# e.g. "https://sepolia.base.org https://mainnet.base.org").
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: openad-web
  labels:
    env: ${ENV}
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Static nginx site, no database connection: capped for cost control only, not a
        # connection budget concern (docs/deploy-gcp.md "Connection budget", ROADMAP 6.9).
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containers:
        - image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/openad/web:${IMAGE_TAG}
          ports:
            - name: http1
              containerPort: 8080
          env:
            # Widened from the image's demo-safe default of 'self' (web/Dockerfile) to the
            # real API/RPC/WalletConnect origins this deployed build actually talks to.
            - name: CSP_CONNECT_SRC
              value: "'self' ${API_ORIGIN} ${RPC_ORIGINS} wss://*.walletconnect.com wss://*.walletconnect.org"
