# Cloud Run service spec for `openad-web` (ADR-0017): the real (non-demo) static site,
# public, scale-to-zero-capable. Separate service from `openad-web-demo` so each can be
# promoted/rolled back independently.
#
# Required env vars at render time: PROJECT_ID, REGION, ENV, IMAGE_TAG, API_ORIGIN (e.g.
# https://api.staging.example.com), RPC_ORIGINS (space- or comma-free single CSP fragment,
# e.g. "https://sepolia.base.org https://mainnet.base.org"). Both must be bare origins
# (scheme://host[:port], no path/userinfo) — scripts/deploy-gcp.sh's `origin_of` enforces this
# and refuses a userinfo-bearing value; RPC_ORIGINS defaults to the public chain RPC the web
# app actually uses, never to `RPC_URL` (api/indexer/settler's own, possibly-keyed, backend
# RPC), which must never reach this CSP header.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: openad-web
  labels:
    env: ${ENV}
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Static nginx site, no database connection: capped for cost control only, not a
        # connection budget concern (docs/deploy-gcp.md "Connection budget", ROADMAP 6.9).
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containers:
        - image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/openad/web:${IMAGE_TAG}
          ports:
            - name: http1
              containerPort: 8080
          env:
            # Widened from the image's demo-safe defaults (web/Dockerfile ENV CSP_CONNECT_SRC /
            # CSP_IMG_SRC) to the real API/RPC/WalletConnect origins and media sources this
            # deployed build actually talks to.
            - name: CSP_CONNECT_SRC
              # WalletConnect's own SDK opens both an HTTPS relay and a WSS socket to the same
              # hosts (inferred; verify before deploy — check the browser console for CSP
              # violations in staging before setting a real WalletConnect id in prod).
              value: "'self' ${API_ORIGIN} ${RPC_ORIGINS} https://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.com wss://*.walletconnect.org"
            - name: CSP_IMG_SRC
              # Paid media serves from this deployment's own API origin (/v1/serve/{id}/media).
              # House-ad media is publisher-hosted, so it can be any https:// URL (the <open-ad>
              # embed element's own creative, and the Supply house-ad preview) — never widen
              # this beyond https: to a specific host list.
              value: "'self' data: ${API_ORIGIN} https:"
