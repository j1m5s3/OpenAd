<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OpenAd — an open, non-custodial ad marketplace on Base." />
    <title>OpenAd</title>
    <!-- Static defaults only: a shared page carries the same preview everywhere it's linked.
         Per-slot previews (e.g. a slot page's own domain and price) need server-rendered OG tags,
         which this SPA does not do — tracked in ROADMAP 7.1. -->
    <meta property="og:title" content="OpenAd — non-custodial ad marketplace on Base" />
    <meta
      property="og:description"
      content="Publishers sell each period of an ad slot by Dutch auction; advertisers buy a period in one transaction. No custody, no tracking, 2.5% default fee."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
